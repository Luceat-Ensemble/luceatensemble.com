<script>

  var l = (navigator.language || 'it').slice(0, 2).toLowerCase();
  location.replace(l === 'it' ? 'it/' : l === 'de' ? 'de/' : (l === 'fr' || l === 'rm') ? 'it/' : 'en/');
</script>
